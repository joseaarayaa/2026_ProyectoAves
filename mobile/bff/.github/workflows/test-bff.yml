name: Test BFF (Dart)

on:
  push:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'bff/**'
  pull_request:
    branches: [ "main", "master", "develop" ]
    paths:
      - 'bff/**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar SDK de Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 'stable'

      - name: Instalar dependencias (pub get)
        run: |
          cd bff
          dart pub get

      - name: Analizar código (dart analyze)
        run: |
          cd bff
          dart analyze

      - name: Ejecutar pruebas unitarias (dart test)
        run: |
          cd bff
          dart test
